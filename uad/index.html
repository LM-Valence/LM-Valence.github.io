<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#054b36">
  <meta name="description" content="LM Pilot Pro UAD — Centre de pilotage logistique — Entrepôt Valence">
  <link rel="manifest" href="./manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <title>LM Pilot Pro UAD</title>
  <style>
    :root{--green:#054b36;--green-dark:#023d2c;--lime:#d7ff31;--loading-height:54px}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--green);font-family:Arial,Helvetica,sans-serif}
    .shell{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;background:var(--green);opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}
    .loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .splash-content{width:100%;height:calc(100% - var(--loading-height));display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--green)}
    .splash-image{display:block;width:100%;height:100%;object-fit:contain;object-position:center;user-select:none;-webkit-user-drag:none}
    .loading-footer{position:relative;width:100%;height:var(--loading-height);flex:0 0 var(--loading-height);display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#033e2e,#07583e,#033e2e);border-top:1px solid rgba(215,255,49,.18);box-shadow:0 -6px 20px rgba(0,0,0,.15)}
    .loading-status{display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:14px;font-weight:800}
    .loading-dot{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(215,255,49,.10);animation:pulse 1.3s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(.85);opacity:.65}50%{transform:scale(1.18);opacity:1}}
    .progress{position:absolute;left:0;bottom:0;width:100%;height:3px;overflow:hidden;background:rgba(255,255,255,.08)}
    .progress::after{content:"";position:absolute;top:0;left:-35%;width:35%;height:100%;background:var(--lime);animation:progressMove 1.4s linear infinite}
    @keyframes progressMove{from{left:-35%}to{left:100%}}
    @media(max-width:700px){:root{--loading-height:48px}.loading-status{font-size:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <div id="loading" class="loading">
      <div class="splash-content">
        <img class="splash-image" src="../splash-lm-pilot-pro.jpg?v=2" alt="LM Pilot Pro UAD — Centre de pilotage logistique — Entrepôt Valence">
      </div>
      <div class="loading-footer">
        <div class="loading-status"><span class="loading-dot"></span><span>Leroy Merlin Valence · Chargement de LM Pilot Pro UAD</span></div>
        <div class="progress"></div>
      </div>
    </div>
    <iframe id="lmFrame" title="LM Pilot Pro UAD" allow="fullscreen; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    const APPS_SCRIPT_URL="https://script.google.com/a/macros/leroymerlin.fr/s/AKfycbyfeUzE6OUSzY9TzVSyoyhF9HgNavVBI4dCBXQYRTZ2qSGQjyIa3d1xWxfN05o2TwYUOw/exec";
    function targetUrl(){const q=new URLSearchParams(window.location.search);const page=(q.get('page')||'').trim();return page?APPS_SCRIPT_URL+'?page='+encodeURIComponent(page):APPS_SCRIPT_URL}
    const frame=document.getElementById('lmFrame');
    const loading=document.getElementById('loading');
    const splashStart=Date.now();
    const MIN_SPLASH_TIME=1500;
    frame.src=targetUrl();
    frame.addEventListener('load',()=>{const remaining=Math.max(0,MIN_SPLASH_TIME-(Date.now()-splashStart));setTimeout(()=>loading.classList.add('hidden'),remaining)});
    if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js?v=2',{updateViaCache:'none'}).then(reg=>reg.update()).catch(console.error)})}
  </script>
</body>
</html>
