<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6145">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Partager le bilan · Entrepôt Valence</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:Arial,Helvetica,sans-serif;color:#17384d;background:#f3f7f6}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px 14px}
    main{width:100%;max-width:430px;background:white;border:1px solid #d8e6e0;border-radius:18px;
      padding:24px 21px;box-shadow:0 8px 25px rgba(21,55,74,.08)}
    .eyebrow{color:#137846;font-weight:800;font-size:12px;letter-spacing:.08em}
    h1{font-size:25px;line-height:1.2;margin:12px 0}
    p{font-size:14px;color:#5a7180;line-height:1.5}
    #status{color:#156a43;font-weight:600;min-height:41px}
    button,a.button{display:block;width:100%;border:0;border-radius:11px;text-align:center;font:700 17px Arial,Helvetica,sans-serif;
      padding:16px 12px;background:#147d48;color:white;cursor:pointer;text-decoration:none;margin:17px 0}
    button:disabled{background:#b0c8ba;cursor:wait}
    a.button{background:#f1f6f7;color:#18394d;border:1px solid #d6e2e7;font-size:14px}
    [hidden]{display:none!important}
    .note{border-top:1px solid #e2ecea;margin-top:18px;padding-top:15px;font-size:12px;color:#6a7d86}
  </style>
  <script src="./partager-mobile.js" defer></script>
</head>
<body>
  <main>
    <div class="eyebrow">ENTREPÔT VALENCE · UAG / UAD</div>
    <h1>Partager le bilan</h1>
    <p id="status" role="status" aria-live="polite">Préparation de votre image PNG…</p>
    <button id="share" type="button" disabled>↗ Partager le PNG</button>
    <a class="button" id="download" href="#" download="Bilan_Valence.png" hidden>↓ Télécharger le PNG</a>
    <p class="note">Le menu de partage Android s’ouvrira lorsque vous appuierez sur le bouton vert. Votre image reste sur votre appareil : aucune donnée du bilan n'est enregistrée sur cette page.</p>
  </main>
</body>
</html>
