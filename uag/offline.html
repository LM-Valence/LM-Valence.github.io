<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075c43">
  <title>LM Pilot Pro UAG — Hors connexion</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#033d2d,#08704e);font-family:Arial,Helvetica,sans-serif;color:#fff}
    main{width:min(520px,100%);padding:38px;text-align:center;border:1px solid rgba(255,255,255,.18);border-radius:28px;background:rgba(2,48,35,.78);box-shadow:0 24px 70px rgba(0,0,0,.3)}
    img{width:112px;height:112px;margin-bottom:18px}
    h1{margin:0 0 12px;font-size:30px}
    p{margin:0 0 26px;line-height:1.55;color:#dfece7}
    button{border:0;border-radius:14px;padding:14px 22px;background:#d7ff31;color:#033d2d;font-weight:900;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="./icon-uag.svg" alt="">
    <h1>Connexion indisponible</h1>
    <p>LM Pilot Pro UAG nécessite une connexion au réseau pour charger les données opérationnelles.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
